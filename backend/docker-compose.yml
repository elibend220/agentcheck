version: '3.8'

services:
  jarvis-backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - WORKERS=4
    volumes:
      - ./server.py:/app/server.py
      - ../agents:/app/agents
      - ../tools:/app/tools
      - ../learning:/app/learning
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  jarvis-network:
    driver: bridge

volumes:
  jarvis-data:
    driver: local
