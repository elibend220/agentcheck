name: Deploy to GitHub Pages

# DISABLED: This is a Python trading system, not a static site
# To enable: Create a docs/ directory with documentation
# Then uncomment the triggers below

on:
  workflow_dispatch:  # Manual trigger only
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'docs/**'
  #     - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        if: hashFiles('docs/**') != ''  # Only deploy if docs/ exists
